trading:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: trino
      method: none
      user: "{{ env_var('DBT_TRINO_USER', 'trino') }}"
      password: "{{ env_var('DBT_TRINO_PASSWORD', '') }}"
      database: "{{ env_var('DBT_TRINO_DATABASE', 'iceberg') }}"
      host: "{{ env_var('DBT_TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_TRINO_PORT', '8082') | int }}"
      schema: "{{ env_var('DBT_TRINO_SCHEMA', 'raw_vault') }}"
      threads: "{{ env_var('DBT_THREADS', '1') | int }}"
      http_scheme: "{{ env_var('DBT_TRINO_HTTP_SCHEME', 'http') }}"
      cert: false
      retries: 3

    prod:
      type: trino
      method: none
      user: "{{ env_var('DBT_TRINO_USER', 'trino') }}"
      password: "{{ env_var('DBT_TRINO_PASSWORD', '') }}"
      database: "{{ env_var('DBT_TRINO_DATABASE', 'iceberg') }}"
      host: "{{ env_var('DBT_TRINO_HOST', 'trino') }}"
      port: "{{ env_var('DBT_TRINO_PORT', '8080') | int }}"
      schema: "{{ env_var('DBT_TRINO_SCHEMA', 'raw_vault') }}"
      threads: "{{ env_var('DBT_THREADS', '1') | int }}"
      http_scheme: http
      cert: false
      retries: 3

    postgres:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'dbt_user') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'dbt_password') }}"
      dbname: "{{ env_var('DBT_POSTGRES_DB', 'iceberg_dbt') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA', 'raw_vault') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      sslmode: disable
