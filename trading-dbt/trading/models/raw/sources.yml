version: 2

sources:
  - name: raw
    description: Landing tables. Iceberg `raw` on Trino, or Postgres `trading` for the interactive PoC.
    database: "{{ var('raw_database', 'iceberg') }}"
    schema: "{{ var('raw_schema', 'raw') }}"
    tables:
      - name: assets
        description: Physical generators and storage devices from Emsys and ERP.
      - name: portfolios
        description: Periotheus trading portfolios.
      - name: portfolio_membership
        description: Effectivity of asset membership in a trading portfolio.
      - name: markets
        description: Wholesale, balancing and capacity market codes.
      - name: trade_orders
        description: Confirmed Periotheus orders and trades.
      - name: emsys_telemetry
        description: High-frequency asset telemetry from Emsys VPP.
      - name: capacity_status
        description: Declared availability and outage status for capacity markets.
      - name: meteologica_forecast
        description: Ensemble and intraday forecasts. Several rows share one asset and run timestamp.
      - name: portfolio_settlement
        description: Portfolio-level day-ahead revenue and imbalance cost.
      - name: balancing_settlement
        description: Portfolio-level aFRR, mFRR, FCR and capacity payments.
      - name: market_prices
        description: Clearing prices used to monetise curtailment.
      - name: down_regulation_events
        description: Elering / ETRM down-regulation commands applied to VPP setpoints.
      - name: afrr_activations
        description: Thin PICASSO-like aFRR setpoint activations (slowed clock).
      - name: mfrr_activations
        description: MARI-style mFRR activations at ISP grain.
